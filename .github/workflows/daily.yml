name: UZI 每日选股邮件

on:
  workflow_dispatch:        # 手动可点 Run workflow
  schedule:
    - cron: '30 8 * * 1-5'   # 08:30 UTC = 北京 16:30（收盘后）· 周一到周五

concurrency:
  group: uzi-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 跑每日选股并发邮件
        env:
          # 你已配的这套(与 daily_stock_analysis 同名) —— SMTP 服务器从邮箱后缀自动推
          EMAIL_SENDER:      ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:    ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS:   ${{ secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ secrets.EMAIL_SENDER_NAME }}
          TOP_N: '30'
        run: python daily_report.py
